; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
; PlatformIO generates the partition table from this key and ignores
; CONFIG_PARTITION_TABLE_* in sdkconfig, so the 1500K app partition has to be
; requested here. Both mesh roles compiled together overflow the default 1M.
board_build.partitions = partitions_singleapp_large.csv
; 115200 is the stable speed for the ESP32; you can change it to 921600 for maximum speed
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3

; Battery sense -- OFF until the pin is confirmed.
;
; Uncomment BATT_ADC_GPIO below and set it to the pin your divider actually
; feeds, then set the ratio. While it is commented out, BATT_MV and BATT_PCT
; report "-" (unavailable) rather than a number, which is the honest answer for
; a board whose divider we cannot see.
;
; This is not caution for its own sake: GPIO34 was tried on the COM3 board and
; read 284 mV of noise on a floating pin. An unconfigured ADC reports a
; plausible-looking voltage, so a wrong pin is worse than no pin.
;
;   vbatt_mv = measured_mv * BATT_DIVIDER_NUM / BATT_DIVIDER_DEN
;   two equal resistors halve the battery, so NUM/DEN = 2/1
;
; Only ADC1 pins (32-39) work -- ADC2 is claimed by the radio and fails while
; the mesh is up. Prefer 34-39: they are input-only and cannot be driven by
; mistake.
build_flags =
;    -DBATT_ADC_GPIO=34
    -DBATT_DIVIDER_NUM=2
    -DBATT_DIVIDER_DEN=1
